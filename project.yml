name: SKUProbe
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

schemes:
  SKUProbe:
    build:
      targets:
        SKUProbe: all
    run:
      config: Release
    archive:
      config: Release

targets:
  SKUProbe:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SKUProbe
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.skuprobe
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
