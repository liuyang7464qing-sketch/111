name: build-ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project SKUProbe.xcodeproj \
            -scheme SKUProbe \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/SKUProbe.app" Payload/
          zip -qry SKUProbe.ipa Payload
          ls -lh SKUProbe.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SKUProbe-ipa
          path: SKUProbe.ipa
          if-no-files-found: error
